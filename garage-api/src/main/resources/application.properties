
# Nom de l'application (deja present, ne pas toucher).
spring.application.name=garage-api

# Profil actif : Spring va lire application.properties PUIS application-dev.properties.
# Pour changer de base plus tard (MySQL), on changera seulement ce mot.
spring.profiles.active=dev

# Actuator : on n'expose que /actuator/health (l'hebergeur s'en sert pour savoir
# si l'application tourne). Aucun autre point technique n'est visible de l'exterieur.
management.endpoints.web.exposure.include=health
