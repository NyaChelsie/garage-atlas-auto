# --- Base MySQL (profil prod) ---
# ${NOM:valeur} : Spring lit la variable d'environnement NOM ;
# s'il n'y en a pas, il prend la valeur apres les deux-points.

# Adresse de la base. 3306 = le port habituel de MySQL.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/garage_db}

# Utilisateur DEDIE (pas root).
spring.datasource.username=${DB_USER:garage_user}

# Mot de passe : AUCUNE valeur par defaut, et surtout jamais ecrit ici.
# Il vient uniquement de la variable d'environnement DB_PASSWORD.
spring.datasource.password=${DB_PASSWORD}

# Le "pilote" qui sait parler a MySQL.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Hibernate ---

# update : cree les tables si elles n'existent pas, ajoute ce qui manque,
# mais n'EFFACE JAMAIS les donnees au redemarrage.
# (Ne jamais utiliser create ou create-drop ici : ils videraient la base.)
spring.jpa.hibernate.ddl-auto=update

# En prod on n'affiche plus chaque requete SQL dans la console.
spring.jpa.show-sql=false

# Pas de console H2 avec MySQL.
spring.h2.console.enabled=false