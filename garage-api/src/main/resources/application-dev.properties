# --- Base de donnees H2 en memoire ---

# Adresse de la base. "mem" = en memoire : elle disparait a l'arret du back.
# "garagedb" est simplement le nom que l'on donne a cette base.
spring.datasource.url=jdbc:h2:mem:garagedb

# Le "pilote" qui sait parler a H2.
spring.datasource.driver-class-name=org.h2.Driver

# Identifiants par defaut de H2 : utilisateur "sa", mot de passe vide.
spring.datasource.username=sa
spring.datasource.password=

# --- Console H2 : une page web pour regarder la base ---

# Active la console.
spring.h2.console.enabled=true
# Adresse de la console : http://localhost:8080/h2-console
spring.h2.console.path=/h2-console

# --- Hibernate (le secretaire qui range les fiches) ---

# create-drop : au demarrage, Hibernate CREE les tables d'apres nos entites ;
# a l'arret, il les SUPPRIME. Pratique en developpement : base propre a chaque lancement.
spring.jpa.hibernate.ddl-auto=create-drop

# Affiche dans la console IntelliJ chaque requete SQL executee.
spring.jpa.show-sql=true
# Met le SQL en forme (sur plusieurs lignes) pour le lire plus facilement.
spring.jpa.properties.hibernate.format_sql=true