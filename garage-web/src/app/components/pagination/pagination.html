@if (totalElements() > 0) {
  <div class="mt-4 flex flex-wrap items-center justify-between gap-3 text-sm">
    <span class="text-gray-600">
      Page {{ page() + 1 }} sur {{ totalPages() }} ({{ totalElements() }} éléments)
    </span>

    <div class="flex gap-2">
      <button
        type="button"
        class="rounded border border-indigo-600 px-3 py-2 font-semibold text-indigo-600 hover:bg-indigo-600 hover:text-white disabled:cursor-not-allowed disabled:opacity-40 disabled:hover:bg-transparent disabled:hover:text-indigo-600"
        [disabled]="page() === 0"
        (click)="changer.emit(page() - 1)"
      >
        Précédent
      </button>
      <button
        type="button"
        class="rounded border border-indigo-600 px-3 py-2 font-semibold text-indigo-600 hover:bg-indigo-600 hover:text-white disabled:cursor-not-allowed disabled:opacity-40 disabled:hover:bg-transparent disabled:hover:text-indigo-600"
        [disabled]="page() + 1 >= totalPages()"
        (click)="changer.emit(page() + 1)"
      >
        Suivant
      </button>
    </div>
  </div>
}
